# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Что можно разместить на Render:
#   ✅ Сайт (web)                — gunicorn run_server:app
#   ✅ Telegram-бот (web, free)  — run_bot_service.py (Telegram доступен с US-IP)
#   ❌ Автообновление расписания — DDoS-Guard отдаёт 403 с не-РФ IP.
#        Держите start_scheduler.py на РФ-машине (пишет в общий Postgres)
#        либо задайте SCHEDULE_PROXY (российский прокси).
#
# Данные: диск Render эфемерный, SQLite стирается при рестарте.
#   → подключите внешний Postgres и задайте DATABASE_URL (Neon/Supabase/Render).

envVarGroups:
  - name: schedule-sevsu
    envVars:
      - key: SCHEDULE_ICS_URL
        sync: false
      - key: DEFAULT_GROUP
        value: rs-s-26-1-o
      - key: UPDATE_INTERVAL_MINUTES
        value: "30"
      - key: WEEKS_AHEAD
        value: "8"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      # Обязательно для сохранения данных между рестартами:
      # - key: DATABASE_URL
      #   sync: false
      # - key: SCHEDULE_PROXY
      #   sync: false

services:
  # ─── Сайт ───
  - type: web
    name: schedule-sevsu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_server:app --bind 0.0.0.0:$PORT
    envVars:
      - fromGroup: schedule-sevsu

  # ─── Telegram-бот как бесплатный web-сервис (слушает $PORT) ───
  - type: web
    name: schedule-sevsu-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot_service.py
    envVars:
      - fromGroup: schedule-sevsu

  # ─── Автообновление расписания (нужен РФ-IP или SCHEDULE_PROXY) ───
  # На Render бесплатного cron нет; при заданном SCHEDULE_PROXY можно так:
  # - type: cron
  #   name: schedule-sevsu-update
  #   runtime: python
  #   plan: starter
  #   schedule: "*/30 * * * *"
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python update_once.py
  #   envVars:
  #     - fromGroup: schedule-sevsu
