# Render Blueprint: https://render.com/docs/blueprint-spec
#
# ВАЖНО (см. README → Деплой):
#  - Web-сервис (сайт) можно ставить на Render.
#  - Бот (worker) на Render работает (Telegram доступен), см. TELEGRAM_PROXY не нужен.
#  - Cron-обновление расписания требует российский IP. На Render будет 403,
#    поэтому либо задайте SCHEDULE_PROXY (российский прокси), либо держите
#    start_scheduler.py на российской машине.
#  - Данные: SQLite на Render эфемерна. Подключите Postgres (DATABASE_URL)
#    или Render Disk + SCHEDULE_DB_PATH=/var/data/schedule.db

envVarGroups:
  - name: schedule-sevsu
    envVars:
      - key: SCHEDULE_ICS_URL
        sync: false
      - key: DEFAULT_GROUP
        value: rs-s-26-1-o
      - key: UPDATE_INTERVAL_MINUTES
        value: "30"
      - key: WEEKS_AHEAD
        value: "8"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      # - key: SCHEDULE_PROXY
      #   sync: false
      # - key: TELEGRAM_PROXY
      #   sync: false

services:
  # ─── Сайт ───
  - type: web
    name: schedule-sevsu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_server:app --bind 0.0.0.0:$PORT
    envVars:
      - fromGroup: schedule-sevsu

  # ─── Telegram-бот (нужен платный план — background worker) ───
  - type: worker
    name: schedule-sevsu-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python start_bot.py
    envVars:
      - fromGroup: schedule-sevsu

  # ─── Обновление расписания (cron; нужен российский IP или SCHEDULE_PROXY) ───
  - type: cron
    name: schedule-sevsu-update
    runtime: python
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python update_once.py
    envVars:
      - fromGroup: schedule-sevsu
