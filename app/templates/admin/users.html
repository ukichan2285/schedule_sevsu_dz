{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-people"></i> Пользователи</h2>
    <a href="/admin" class="btn btn-outline-secondary btn-sm">← В панель</a>
</div>

<div class="card mb-4">
    <div class="card-header">Создать аккаунт</div>
    <div class="card-body">
        <form method="POST" action="/admin/users/create" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Имя для входа *</label>
                <input type="text" name="username" class="form-control" required placeholder="например ivanov">
            </div>
            <div class="col-md-3">
                <label class="form-label">Пароль *</label>
                <input type="text" name="password" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Имя</label>
                <input type="text" name="first_name" class="form-control">
            </div>
            <div class="col-md-2">
                <label class="form-label">Фамилия</label>
                <input type="text" name="last_name" class="form-control">
            </div>
            <div class="col-md-1">
                <label class="form-label">Роль</label>
                <select name="role" class="form-select">
                    <option value="user">user</option>
                    <option value="admin">admin</option>
                </select>
            </div>
            <div class="col-md-1 d-grid">
                <button class="btn btn-primary">+</button>
            </div>
        </form>
    </div>
</div>

{% for u in users %}
<div class="card mb-2">
    <div class="card-body">
        <form method="POST" action="/admin/users/{{ u.id }}/edit" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small text-muted">Имя для входа</label>
                <input type="text" name="username" class="form-control form-control-sm" value="{{ u.username or '' }}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Имя</label>
                <input type="text" name="first_name" class="form-control form-control-sm" value="{{ u.first_name or '' }}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Фамилия</label>
                <input type="text" name="last_name" class="form-control form-control-sm" value="{{ u.last_name or '' }}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Новый пароль</label>
                <input type="text" name="password" class="form-control form-control-sm" placeholder="не менять">
            </div>
            <div class="col-md-1">
                <label class="form-label small text-muted">Роль</label>
                <select name="role" class="form-select form-select-sm">
                    <option value="user" {% if u.role == 'user' %}selected{% endif %}>user</option>
                    <option value="admin" {% if u.role == 'admin' %}selected{% endif %}>admin</option>
                </select>
            </div>
            <div class="col-md-1">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_active" {% if u.is_active %}checked{% endif %}>
                    <label class="form-check-label small">активен</label>
                </div>
            </div>
            <div class="col-md-1 d-grid gap-1">
                <button class="btn btn-sm btn-primary">Сохранить</button>
            </div>
        </form>
        <div class="mt-1 d-flex justify-content-between align-items-center">
            <small class="text-muted">
                ID: {{ u.id }} · tg: {{ u.telegram_id }} ·
                {% if u.has_password %}🔑 пароль задан{% else %}⚠️ без пароля{% endif %}
            </small>
            <form method="POST" action="/admin/users/{{ u.id }}/delete"
                  onsubmit="return confirm('Удалить пользователя {{ u.username }}?')">
                <button class="btn btn-sm btn-outline-danger">Удалить</button>
            </form>
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
